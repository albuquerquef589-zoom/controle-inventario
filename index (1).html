<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coletor de Inventário</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#111;--mut:#667;--bd:#d8dbe0;--ac:#2E75B6}
@media(prefers-color-scheme:dark){:root{--bg:#121417;--card:#1d2127;--tx:#eee;--mut:#9aa3ad;--bd:#333a44}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:12px;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input{width:100%;padding:12px;font-size:17px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:8px}
button{flex:1;padding:12px;font-size:15px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600}
button.sec{background:var(--bd);color:var(--tx)} button.red{background:#c0392b}
#cam{margin-top:8px}
video{width:100%;border-radius:8px;background:#000;max-height:240px;object-fit:cover}
.big{font-size:28px;font-weight:700} .mut{color:var(--mut);font-size:13px}
ul{list-style:none;padding:0;margin:0} li{padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;font-size:14px}
footer{text-align:center;font-size:10px;color:var(--mut);margin:16px 0}
details summary{font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<h1>📦 Coletor de Inventário</h1>

<div class="card">
  <label for="resp">Responsável</label>
  <input id="resp" placeholder="Seu nome" autocomplete="off">
  <label for="pos">Posição (digite)</label>
  <input id="pos" placeholder="Ex.: 0301AA11" autocapitalize="characters" autocomplete="off">
  <label for="mat">Material (escaneie ou digite + Enter)</label>
  <input id="mat" placeholder="Código do material" inputmode="text" enterkeyhint="send" autocomplete="off">
  <div class="row"><input id="qtd" type="number" min="1" max="999" value="1" aria-label="Quantidade" style="max-width:90px"><button id="bAdd">+ Adicionar manual</button></div>
  <div class="row"><button id="bCam">📷 Escanear com a câmera</button><button id="bRep" class="sec">+1 último</button></div>
  <div id="cam" hidden><video id="v" playsinline muted></video>
    <div class="row"><button id="bStop" class="sec">Fechar câmera</button></div></div>
</div>

<div class="card">
  <div class="row" style="margin:0">
    <div style="flex:1"><div class="mut">Total bipado</div><div class="big" id="tot">0</div></div>
    <div style="flex:1"><div class="mut">Nesta posição</div><div class="big" id="cur">0</div></div>
  </div>
</div>

<div class="card">
  <div class="row" style="margin:0"><button id="bCsv">⬇ Baixar CSV</button><button id="bCopy" class="sec">Copiar p/ Excel</button></div>
  <div class="row"><button id="bUndo" class="sec">Desfazer último</button><button id="bClr" class="red">Limpar tudo</button></div>
  <details style="margin-top:10px"><summary>Envio direto (Google Sheets, opcional)</summary>
    <label for="url">URL do Apps Script</label><input id="url" placeholder="https://script.google.com/macros/s/.../exec">
  </details>
</div>

<div class="card"><div class="mut" style="margin-bottom:6px">Últimas bipagens</div><ul id="lst"></ul></div>
<footer>Feito por Fernando Luiz Santos Albuquerque · Cursando Gestão da Tecnologia da Informação · Suporte Técnico</footer>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const rd=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let bips=rd('bips',[]), cfg=rd('cfg',{});
$('resp').value=cfg.resp||''; $('pos').value=cfg.pos||''; $('url').value=cfg.url||'';
['resp','pos','url'].forEach(i=>$(i).addEventListener('input',()=>{cfg={resp:$('resp').value,pos:$('pos').value,url:$('url').value};wr('cfg',cfg);render()}));

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',1800)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=900;o.connect(a.destination);o.start();o.stop(a.currentTime+.08)}catch(e){}if(navigator.vibrate)navigator.vibrate(60)}

function add(code,n){
  n=n||1;
  const m=String(code||'').trim(), p=$('pos').value.trim().toUpperCase();
  if(!p){toast('Digite a posição primeiro');return false}
  if(!m)return false;
  const nb=[];
  for(let i=0;i<n;i++){const b={p:p,m:m,r:$('resp').value.trim(),d:Date.now()};bips.push(b);nb.push(b)}
  wr('bips',bips); render(); beep(); nb.forEach(send); return true;
}
function send(b){
  if(!cfg.url)return;
  fetch(cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({posicao:b.p,material:b.m,responsavel:b.r,datahora:fmt(b.d)})}).catch(()=>toast('Falha no envio (dado salvo no aparelho)'));
}
function render(){
  const p=$('pos').value.trim().toUpperCase();
  $('tot').textContent=bips.length; $('cur').textContent=bips.filter(b=>b.p===p).length;
  $('lst').innerHTML=bips.slice(-12).reverse().map(b=>'<li><b>'+esc(b.p)+'</b> · '+esc(b.m)+'<br><span class="mut">'+esc(b.r||'—')+' · '+fmt(b.d)+'</span></li>').join('')||'<li class="mut">Nenhuma bipagem ainda</li>';
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function addManual(){
  const n=Math.max(1,Math.min(999,parseInt($('qtd').value)||1));
  if(add($('mat').value,n)){$('mat').value='';$('qtd').value=1;$('mat').focus()}
}
$('mat').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addManual()}});
$('bAdd').onclick=addManual;
$('bRep').onclick=()=>{const l=bips[bips.length-1];if(l){const m=l.m;add(m)}};
$('bUndo').onclick=()=>{bips.pop();wr('bips',bips);render()};
$('bClr').onclick=()=>{if(bips.length&&confirm('Apagar todas as '+bips.length+' bipagens deste aparelho? Baixe o CSV antes.')){bips=[];wr('bips',bips);render()}};

function rows(sep){return bips.map(b=>[b.p,b.m,b.r,fmt(b.d)].join(sep))}
$('bCsv').onclick=()=>{
  if(!bips.length)return toast('Nada para baixar');
  const csv='\uFEFFPOSIÇÃO;MATERIAL;RESPONSÁVEL;DATA/HORA\n'+rows(';').join('\n');
  const d=new Date(), a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='bipagem_'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'_'+p2(d.getHours())+p2(d.getMinutes())+'.csv';
  a.click();
};
$('bCopy').onclick=async()=>{
  if(!bips.length)return toast('Nada para copiar');
  try{await navigator.clipboard.writeText(rows('\t').join('\n'));toast('Copiado. Cole em Bipagem!A2')}catch(e){toast('Não foi possível copiar. Use o CSV')}
};

// ---- câmera ----
let stream=null, reader=null, timer=null, last='', lastT=0;
function onCode(c){const n=Date.now();if(c===last&&n-lastT<2000)return;last=c;lastT=n;add(c)}
async function startCam(){
  if(!$('pos').value.trim())return toast('Digite a posição primeiro');
  $('cam').hidden=false;
  try{
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector();
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      $('v').srcObject=stream; await $('v').play();
      timer=setInterval(async()=>{try{const r=await det.detect($('v'));if(r.length)onCode(r[0].rawValue)}catch(e){}},250);
    }else if(window.ZXing){
      reader=new ZXing.BrowserMultiFormatReader();
      reader.decodeFromVideoDevice(undefined,'v',r=>{if(r)onCode(r.getText())});
    }else{toast('Leitor indisponível. Digite o código.');stopCam()}
  }catch(e){toast('Sem acesso à câmera. Permita o uso e abra via HTTPS.');stopCam()}
}
function stopCam(){
  clearInterval(timer);timer=null;
  if(reader){try{reader.reset()}catch(e){}reader=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('cam').hidden=true;
}
$('bCam').onclick=startCam; $('bStop').onclick=stopCam;
render();
</script>
</body>
</html>
